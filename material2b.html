<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- TROQUE O TÍTULO DA ABA -->
    <title>CH 00 - MATERIAL X ATIVIDADE X</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
        background: #121518;
      }

      /* =========================================================
         CANAL DE TV (mesma estética do menu)
      ========================================================= */
      .tv-channel-wrapper {
        position: relative;
        width: 100%;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #121518;
        color: #e6e6e6;
        font-family: "Courier New", monospace;
        padding: 18px;
        overflow: hidden;
      }

      /* Textos de menu da TV (OSD) */
      .tv-osd-top {
        display: flex;
        justify-content: space-between;
        color: #00ff66;
        font-weight: bold;
        font-size: 14px;
        margin-bottom: 15px;
        text-shadow: 0 0 4px #00ff66;
      }

      /* Caixa central: cresce para empurrar o rodapé para baixo */
      .tv-content {
        flex: 1;
        background: #1c2024;
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #333;
        min-height: 200px;
      }

      /* Rodapé do canal */
      .tv-osd-bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-top: 15px;
        background: #000;
        padding: 6px 12px;
        border-radius: 4px;
        border-left: 3px solid #ff3366;
      }

      .ticker-text {
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 11px;
        color: #ffcc00;
      }

      .tv-logo {
        flex-shrink: 0;
        font-weight: bold;
        background: #ff3366;
        color: #fff;
        padding: 2px 6px;
        font-size: 10px;
        border-radius: 2px;
      }

      /* Linhas de tubo (não bloqueiam cliques) */
      .scanlines {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          rgba(18, 16, 16, 0) 50%,
          rgba(0, 0, 0, 0.25) 50%
        );
        background-size: 100% 4px;
        pointer-events: none;
      }

      /* =========================================================
         ESTILO BÁSICO PARA O SEU CONTEÚDO (pode editar/apagar)
      ========================================================= */
      .tv-content h2 {
        margin-bottom: 10px;
        color: #fff;
      }
      .tv-content p {
        line-height: 1.5;
      }

      /* =========================================================
   CONTEÚDO SEM EFEITO DE TV
   A section fica numa camada acima das scanlines
========================================================= */
      .scanlines {
        z-index: 1;
      }

      .exercicio-container {
        position: relative; /* necessário para o z-index funcionar */
        z-index: 2; /* acima das scanlines */
        background: #ffffff; /* fundo claro próprio */
        color: #222;
        padding: 30px;
        border-radius: 6px;
      }

      /* Os estilos do molde deixam h2 branco; aqui volta ao normal */
      .exercicio-container h1,
      .exercicio-container h2,
      .exercicio-container h3,
      .exercicio-container p {
        color: inherit;
      }

      /* CSS da atividade */
    </style>
  </head>

  <body>
    

      <div class="tv-content">
        <!-- =========================================================
             ★★★ AQUI FICA O CONTEÚDO REAL ★★★
        ========================================================== -->

        <section class="exercicio-container">
          <h2>Crie uma pagina com:</h2>
          <ul>
            <li>A - Campo de Nome (text)</li>
            <li>B - Campo de Email (email)</li>
            <li>C - Campo de Idade (number)</li>
            <li>D - Campo de Mensagem (textarea)</li>
            <li>E - Colocar placeholder em todos os campos</li>
            <li>F - Botão de enviar</li>
            <li>G - Usar a tag &lt;label&gt; antes de cada campo</li>
          </ul>

          <hr />
          <!-- Linha para separar o enunciado do exercício prático -->

          <!-- EXERCÍCIO PRÁTICO -->
          <form action="#" method="POST">
            <div>
              <label for="nome">Nome:</label><br />
              <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite seu nome completo"
              />
            </div>
            <br />

            <div>
              <label for="email">E-mail:</label><br />
              <input
                type="email"
                id="email"
                name="email"
                placeholder="exemplo@email.com"
              />
            </div>
            <br />

            <div>
              <label for="idade">Idade:</label><br />
              <input
                type="number"
                id="idade"
                name="idade"
                placeholder="Digite sua idade"
              />
            </div>
            <br />

            <div>
              <label for="mensagem">Mensagem:</label><br />
              <textarea
                id="mensagem"
                name="mensagem"
                placeholder="Escreva sua mensagem aqui..."
              ></textarea>
            </div>
            <br />

            <button type="submit">Enviar</button>
          </form>

          <div class="js-exercise-area">
            <script></script>
          </div>
        </section>

        <!-- =========================================================
             ★★★ AQUI TERMINA O CONTEÚDO REAL ★★★
        ========================================================== -->
      </div>

 

      <!-- Efeito visual de tubo (scanlines) -->
      <div class="scanlines"></div>
    </div>
  </body>
</html>
